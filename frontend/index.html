<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Skop0 - Plataforma de monitoreo de vulnerabilidades de red para PyMEs. Escanea, detecta y protege tu infraestructura." />
    <title>Skop0 | Monitoreo de Vulnerabilidades</title>
    
    <!-- Favicons nativos e institucionales Skop0 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=skop0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=skop0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=skop0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=skop0" />

    <!-- Blindaje de Interfaz: Bloqueo de menú contextual, inspección y atajos de desarrollo -->
    <script>
      (function() {
        // Bloquear clic derecho (menú contextual)
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        }, { capture: true });

        // Bloquear atajos de teclado de desarrollo
        document.addEventListener('keydown', function(e) {
          // F12 (DevTools)
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I (Inspector), Ctrl+Shift+J (Consola), Ctrl+Shift+C (Element picker)
          if (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U (Ver código fuente), Ctrl+S (Guardar), Ctrl+P (Imprimir)
          if (e.ctrlKey && ['u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Bloquear zoom por teclado (Ctrl+, Ctrl-, Ctrl=, Ctrl0, Numpad +/-)
          if ((e.ctrlKey || e.metaKey) && (
            ['+', '-', '=', '_', '0'].includes(e.key) ||
            ['Equal', 'Minus', 'NumpadAdd', 'NumpadSubtract', 'Digit0', 'Numpad0'].includes(e.code)
          )) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { capture: true });

        // Bloquear zoom con Ctrl + rueda del mouse y gestos pinch del touchpad
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { passive: false, capture: true });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(evt) {
          document.addEventListener(evt, function(e) {
            e.preventDefault();
          }, { passive: false, capture: true });
        });
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #030712;
      }
      #root:empty {
        background: radial-gradient(circle at 50% 30%, #172554 0%, #0a0f1d 70%, #030712 100%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 40px;
        max-width: 480px;
        animation: splashFadeIn 0.3s ease-out;
      }
      .splash-logo-container {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, rgba(59, 130, 246, 0.1) 60%, transparent 70%);
        animation: splashPulse 2s infinite ease-in-out;
      }
      .splash-shield {
        position: relative;
        width: 80px;
        height: 80px;
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      }
      .splash-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-subtitle {
        font-size: 13px;
        color: #94a3b8;
        font-weight: 500;
        margin-bottom: 28px;
        letter-spacing: 0.2px;
      }
      .splash-progress-container {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }
      .splash-progress {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(90deg, #3b82f6, #38bdf8, #10b981);
        border-radius: 999px;
        width: 45%;
        animation: splashIndeterminate 1.4s infinite ease-in-out;
      }
      .splash-status {
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes splashIndeterminate {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash">
        <div class="splash-logo-container">
          <div class="splash-glow"></div>
          <svg class="splash-shield" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="skop0-splash-mk" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#22d3ee"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
              <linearGradient id="skop0-splash-bg" x1="5" y1="5" x2="52" y2="52" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#172236"/>
                <stop offset="100%" stop-color="#070c15"/>
              </linearGradient>
            </defs>
            <rect x="12" y="12" width="47" height="47" rx="13" fill="url(#skop0-splash-mk)" fill-opacity="0.92"/>
            <rect x="5" y="5" width="47" height="47" rx="13" fill="url(#skop0-splash-bg)" stroke="white" stroke-opacity="0.18" stroke-width="1.4"/>
            <g transform="translate(28.5 28.5) scale(0.62) translate(-32 -32)">
              <g transform="translate(32 32) skewX(-14) translate(-32 -32)">
                <rect x="17" y="11" width="30" height="42" rx="15" fill="url(#skop0-splash-mk)" fill-opacity="0.12" stroke="url(#skop0-splash-mk)" stroke-width="6.2"/>
              </g>
              <line x1="9" y1="47" x2="55" y2="17" stroke="url(#skop0-splash-mk)" stroke-width="4.8" stroke-linecap="round"/>
              <circle cx="9" cy="47" r="3.2" fill="#22d3ee"/>
              <circle cx="55" cy="17" r="3.2" fill="#a855f7"/>
            </g>
          </svg>
        </div>
        <div class="splash-title">Skop0</div>
        <div class="splash-subtitle">Plataforma de Monitoreo & Auditoría de Red</div>
        <div class="splash-progress-container">
          <div class="splash-progress"></div>
        </div>
        <div class="splash-status">Iniciando módulos de seguridad...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
